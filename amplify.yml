version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 22.18.0
        - nvm use 22.18.0
        - node -v && npm -v
        - 'echo "Deploying backend for ${AWS_APP_ID}:${AWS_BRANCH} in ${AWS_REGION}"'
        - npx -y ampx pipeline-deploy --branch "${AWS_BRANCH}" --app-id "${AWS_APP_ID}" --debug

frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22.18.0
        - nvm use 22.18.0
        - node -v && npm -v
        - npm ci
    build:
      commands:
        # If Hosting already provided amplify_outputs.json (because the branch is associated),
        # this no-ops. Otherwise, generate it to the repo root to match ../amplify_outputs.json.
        - 'test -f amplify_outputs.json || npx -y ampx generate outputs --branch "${AWS_BRANCH}" --app-id "${AWS_APP_ID}" --out-dir .'
        - 'test -f amplify_outputs.json || (echo "ERROR: amplify_outputs.json missing. Link this branch to a backend OR grant CodeBuild CloudFormation read to run ampx generate outputs." && exit 1)'
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - ~/.npm/**/*
