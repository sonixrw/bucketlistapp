version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22.18.0
            - nvm use 22.18.0
            - node -v && npm -v
            - npx -y ampx generate outputs --app-id $AWS_APP_ID --branch $AWS_BRANCH --out-dir .
            - test -f amplify_outputs.json && echo "outputs ready"
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ~/.npm/**/*

