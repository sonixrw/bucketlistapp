version: 1
backend:
  phases:
    build:
      commands:
        - echo "Backend: $AWS_APP_ID / $AWS_BRANCH / $AWS_REGION"
        - nvm install 22.18.0
        - nvm use 22.18.0
        - node -v && npm -v
        # Deploy/Update the Gen 2 backend stack for this branch in CI
        - npx -y ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID" --debug
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22.18.0
        - nvm use 22.18.0
        - node -v && npm -v
        - npm ci
    build:
      commands:
        # If the branch is associated, Hosting auto-provides outputs.
        # Otherwise, fetch outputs from the backend we just deployed.
        - test -f amplify_outputs.json || npx -y ampx generate outputs --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID" --out-dir .
        - test -f amplify_outputs.json || (echo "ERROR: amplify_outputs.json missing. Ensure this branch is linked to the backend or keep the generate step and grant CFN read." && exit 1)
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - ~/.npm/**/*
