version: 1
applications:
  - appRoot: .
    backend:
      phases:
        build:
          commands:
            - nvm install 22.18.0
            - nvm use 22.18.0
            - node -v && npm -v
            - 'echo "Deploying backend for ${AWS_APP_ID}:${AWS_BRANCH} in ${AWS_REGION}"'
            # Create/update the Gen 2 backend for this branch (runs only in CI)
            - npx -y ampx pipeline-deploy --branch "${AWS_BRANCH}" --app-id "${AWS_APP_ID}" --debug
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22.18.0
            - nvm use 22.18.0
            - node -v && npm -v
            - npm ci
        build:
          commands:
            # If Hosting already provides amplify_outputs.json (branch associated), this is a no-op.
            # Otherwise, fetch outputs from the backend we just deployed and write to repo root
            - 'test -f amplify_outputs.json || npx -y ampx generate outputs --branch "${AWS_BRANCH}" --app-id "${AWS_APP_ID}" --out-dir .'
            - 'test -f amplify_outputs.json || (echo "ERROR: amplify_outputs.json missing. Link this branch to a backend OR grant CloudFormation read to the build role." && exit 1)'
            - npm run build
    artifacts:
      baseDirectory: dist
      files:
        - '**/*'
    cache:
      paths:
        - node_modules/**/*
        - ~/.npm/**/*
